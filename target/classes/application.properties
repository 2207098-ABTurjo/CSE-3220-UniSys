spring.application.name=university-management-system
server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/university_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:university}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:university123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false
